<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Site desafio 1 </title>
</head>
<body>
    <h1>Site desafio 1 - formulário</h1>

    <section>
        <h2>Formulário de escola</h2>

        <form action=""">
           
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required> <br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required> <br>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" required> <br>

            <label for="materia">Qual matéria está se candidatando?</label>
                
                <select name="materia" id="materia">
                    
                    <option value="matematica">Matemática</option>
                    <option value="portugues">Português</option>
                    <option value="ciencias">Ciências</option>
                    <option value="historia">História</option>
                    <option value="geografia">Geografia</option>
                    <option value="artes">Artes</option>
                
                </select> <br>
            
            </label>

            <label for="nivel">qual seu nível escolar:</label>
                
                <select name="nivel" id="nivel">
                    
                    <option value="ensino sup. completo">Ensino Superior Completo</option>
                    <option value="cursando mestrado">Cursando Mestrado</option>
                    <option value="mestrado completo">Mestrado Completo</option>
                    <option value="cursando doutorado">Cursando Doutorado</option>
                    
                    <option value="doutorado completo">Doutorado Completo</option>
                
                </select> <br>
            
            </label>
            
            
            <label for="descrição">Se descreva:</label>
            <textarea id="descrição" name="descrição" required></textarea>

            <button type="submit">Enviar</button>
        </form>
</body>
</html>
